{% extends "base.html" %}

{% block title %}文件 · NASVault{% endblock %}

{% block head_extra %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
{% endblock %}

{% block breadcrumb %}
<span>文件</span>
{% endblock %}

{% block main %}

<!-- Phase A transitional: 临时按钮区，Phase B 拆 settings page 时迁出 -->
<div class="phase-a-actions" data-bs-theme="dark">
    <button type="button" class="nv-toolbar-btn" onclick="showAIConfig()">
        <i class="bi bi-robot"></i>AI 配置
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="showEmbyConfig()">
        <i class="bi bi-display"></i>Emby
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="showQBitConfig()">
        <i class="bi bi-globe2"></i>qBit
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="showNASConfig()">
        <i class="bi bi-hdd-network"></i>NAS
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="showOrganizeConfig()">
        <i class="bi bi-folder-symlink"></i>媒体库根
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="showAutoOrganizeConfig()">
        <i class="bi bi-magic"></i>自动整理
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="openScanModal()">
        <i class="bi bi-arrow-repeat"></i>全库扫描
    </button>
    <button type="button" class="nv-toolbar-btn" onclick="openBatchIdentify()">
        <i class="bi bi-stars"></i>批量识别
    </button>
    <button class="nv-ghost-btn" style="margin-left:auto;" onclick="refreshDisk()" title="刷新磁盘">
        <i class="bi bi-arrow-clockwise"></i>
    </button>
</div>

<!-- Provider 状态异常 banner（仅 auth_failed/unreachable 时由 JS 显示） -->
<div id="provider-banner" class="provider-banner" style="display:none;" data-bs-theme="dark">
    <span class="provider-banner-icon"><i class="bi bi-exclamation-triangle-fill"></i></span>
    <span id="provider-banner-text" class="provider-banner-text"></span>
    <button class="provider-banner-btn" onclick="loadProvidersStatus(true)" title="重新检测 provider 状态">
        <i class="bi bi-arrow-clockwise"></i> 重试
    </button>
    <button class="provider-banner-btn" onclick="dismissProviderBanner()" title="本次会话不再提醒">
        <i class="bi bi-x-lg"></i>
    </button>
</div>

{% include "partials/views/files_view.html" %}

{% include "_legacy_modals.html" %}
{% endblock %}

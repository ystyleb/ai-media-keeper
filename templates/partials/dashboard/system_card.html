<div class="space-y-2">
    {% for p in providers %}
    <div class="flex items-center justify-between gap-2" title="{{ p.tooltip }}">
        <div class="flex items-center gap-2 min-w-0">
            <span class="sb-dot-{{ p.dot }}"></span>
            <span class="text-slate-200 shrink-0">{{ p.name }}</span>
        </div>
        <span class="text-xs text-slate-400 truncate text-right">{{ p.detail or p.message or '—' }}</span>
    </div>
    {% endfor %}
</div>
